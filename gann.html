<!-- Styles -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
  
  #chartdiv {
    width: 100%;
    height: 100%;
  }
</style>

<!-- Resources -->
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
<script src="https://cdn.amcharts.com/lib/5/plugins/colorPicker.js"></script>
<script src="https://cdn.amcharts.com/lib/5/gantt.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<!-- Chart code -->
<script>
var root = null;
var gantt = null;

function renderGanttChart(roadmapData) {
  // Dispose existing chart if any
  if (root) {
    root.dispose();
  }

  // Create root
  root = am5.Root.new("chartdiv");
  root.setThemes([
    am5themes_Animated.new(root)
  ]);

  // Gantt chart
  gantt = root.container.children.push(
    am5gantt.Gantt.new(root, {})
  );

  // ===== 2) Transform JSON -> categoryData + seriesData ========

  var categoryData = [];
  var seriesData = [];

  // Map to ensure each resource is added once
  var resourceToId = new Map();
  var resourceIndex = 1;

  roadmapData.forEach(function (item, idx) {
    // Create or reuse resource row
    var resourceName = item.resource || "Unassigned";
    var resourceId = resourceToId.get(resourceName);
    if (!resourceId) {
      resourceId = "res_" + resourceIndex++;
      resourceToId.set(resourceName, resourceId);

      categoryData.push({
        name: resourceName,
        id: resourceId
      });
    }

    // Task node under that resource
    var taskId = item.id || ("task_" + (idx + 1));
    categoryData.push({
      name: item.name,
      id: taskId,
      parentId: resourceId
    });

    // Convert dates to millis and duration in days
    var startMs = new Date(item.start).getTime();
    var endMs = new Date(item.end).getTime();
    var oneDay = 24 * 60 * 60 * 1000;
    var durationDays = Math.max(1, Math.round((endMs - startMs) / oneDay));

    seriesData.push({
      category: taskId,
      start: startMs,
      duration: durationDays,
      progress: (item.progress || 0) / 100,  // amCharts expects 0–1
      id: taskId,
      status: item.status
    });
  });

  // Optional: vertical "markers" (milestones) if you want them
  var markedDates = []; // e.g. [new Date("2025-02-01").getTime()];

  // ===== 3) Bind data to Gantt ================================

  // Category hierarchy (resources -> tasks)
  gantt.yAxis.data.setAll(categoryData);

  // Bars
  gantt.series.data.setAll(seriesData);

  // If you want vertical markers, uncomment:
  // gantt.createXAxisRanges(markedDates);

  gantt.appear();
}

// Default data for initial load
var defaultRoadmapData = [
  {
    id: "T1",
    resource: "Design Team",
    name: "Discovery & Research",
    start: "2025-01-01",
    end: "2025-01-10",
    progress: 60,
    status: "In Progress"
  },
  {
    id: "T2",
    resource: "Design Team",
    name: "High-level UX",
    start: "2025-01-11",
    end: "2025-01-20",
    progress: 30,
    status: "In Progress"
  },
  {
    id: "T3",
    resource: "Backend Team",
    name: "API Design",
    start: "2025-01-15",
    end: "2025-02-05",
    progress: 10,
    status: "Planned"
  }
];

// Listen for messages from parent window
window.addEventListener('message', function(event) {
  if (event.data.type === 'updateGantt' && event.data.data) {
    renderGanttChart(event.data.data);
  }
});

// Initial render with default data
am5.ready(function () {
  renderGanttChart(defaultRoadmapData);
});
</script>

<!-- HTML -->
<div id="chartdiv"></div>
